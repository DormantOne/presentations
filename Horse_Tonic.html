<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horse Tonic</title>
<meta name="description" content="A muscle-driven SVG film for the song Horse Tonic: a robot horse walks the blueprint, the grid goes dark, and a living horse walks on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{--ui:#e8eef6;--dim:#9fb0c3;--accent:#ffb34a;--cyan:#7fe6ff;font-family:B612,"Avenir Next","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#0a1a2c;color:var(--ui);transition:background-color .6s linear}
.theater{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px 16px 22px}
.screen{position:relative;width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9;overflow:hidden;border-radius:3px;background:#02060d;box-shadow:0 28px 90px rgba(0,0,0,.5);margin:0}
#film{display:block;width:100%;height:100%}
.poster{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding-left:9%;background:linear-gradient(90deg,rgba(2,8,16,.55),rgba(2,8,16,0) 55%)}
.poster[hidden],.endcard[hidden]{display:none}
.bigplay{display:flex;align-items:center;gap:18px;background:none;border:0;color:var(--ui);cursor:pointer;padding:10px 14px;border-radius:999px;font:inherit}
.bigplay .disc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#1a1206;box-shadow:0 0 0 10px rgba(255,179,74,.18)}
.bigplay .disc svg{width:34px;height:34px;margin-left:5px;fill:currentColor}
.bigplay .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.bigplay .txt b{font-size:22px;font-weight:700;letter-spacing:.02em}
.bigplay .txt span{font-size:14px;color:var(--dim)}
.bigplay:hover .disc{background:#ffc874}
.endcard{position:absolute;inset:auto 0 9% 0;display:flex;justify-content:center}
.endcard button{font:inherit;font-size:16px;color:#1a1206;background:#f3e6c6;border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
.transport{width:min(100%,calc((100vh - 120px)*16/9));display:flex;align-items:center;gap:14px;font-size:14px}
.tp{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,238,246,.35);background:rgba(255,255,255,.06);color:var(--ui);display:grid;place-items:center;cursor:pointer}
.tp svg{width:18px;height:18px;fill:currentColor}
.time{font-variant-numeric:tabular-nums;min-width:96px;color:var(--ui)}
.section{color:var(--dim);min-width:64px}
.scrub{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none;border-radius:4px}
.scrub .seg{position:absolute;top:13px;height:4px;background:rgba(232,238,246,.22);border-left:2px solid transparent;background-clip:padding-box}
.scrub .fill{position:absolute;top:13px;left:0;height:4px;background:var(--accent);pointer-events:none}
.scrub .knob{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pill{flex:none;font:inherit;font-size:13px;color:var(--ui);background:transparent;border:1px solid rgba(232,238,246,.35);border-radius:999px;padding:7px 13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ui);color:#0b1626;border-color:var(--ui)}
button:focus-visible,.scrub:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.note{max-width:min(100%,calc((100vh - 120px)*16/9));margin:0;color:#ffd7a0;font-size:13px;line-height:1.5}
.note[hidden]{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* blueprint line art */
.bp{color:#e3f0ff;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.bp text{fill:currentColor;stroke:none;font-family:B612,system-ui,sans-serif;letter-spacing:.12em}
.bp .hd{font-weight:700}
.bp .dimt{fill-opacity:.72}
.bp .thin{stroke-opacity:.5}
.bp .hot{stroke:#ffb34a}
.bp .hot2{stroke:#7fe6ff}
.bp .hotT{fill:#ffb34a}
.bp .pkt{fill:#ffb34a;stroke:none}
.bp .lnk{fill:#7fe6ff}
.bp .cord{stroke-opacity:.8}
.bp .stampR{stroke:#ff4b4b}
.bp .stampT{fill:#ff4b4b;font-weight:700}
.bp .beamF{fill:#7fe6ff;fill-opacity:.1;stroke:none}
.bp .wins{fill:#ffd88a;stroke:none}
.bp .cable{stroke:#ffd88a}
.bp .avl{fill:#ff5040;stroke:none}
.draw [pathLength]{stroke-dasharray:1 1;stroke-dashoffset:var(--d,0)}
.bp .dash{stroke-dasharray:.02 .016}
.draw text{opacity:calc(1 - var(--d,0))}
.ruler text{fill:#ffb34a;fill-opacity:.8;font-family:B612,system-ui,sans-serif;letter-spacing:.08em}
.mc{paint-order:stroke;stroke:#04101e;stroke-width:6;stroke-opacity:.55;stroke-linejoin:round}
.lp{paint-order:stroke;stroke:#1d140c;stroke-width:5;stroke-opacity:.42;stroke-linejoin:round}
@media (max-width:720px){
  .transport{flex-wrap:wrap;gap:10px}
  .scrub{order:5;flex-basis:100%}
  .section{display:none}
  .bigplay .disc{width:64px;height:64px}
  .bigplay .txt b{font-size:18px}
}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>

    <div class="poster" id="poster">

</main>

<script>
'use strict';
/* =====================================================================
   HORSE TONIC — an SVG film in one file
   Architecture borrowed from Muscle Dance:
     intent → agonist/antagonist activation → torque integrator → joint state
            → forward kinematics (3D landmarks) → projected, shaded SVG polygons
   Nothing ever writes a joint angle directly. Choreography only asks.
   ===================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const frac = x => x - Math.floor(x);
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]);
const vnorm = a => { const m = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / m, a[1] / m, a[2] / m]; };
const vlerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };

/* ---------------- song: measured from the uploaded master ---------------- */
// Tempo/phase fitted to onset strength (105.94 BPM, constant). Backbeat on odd beats.
const SONG = { dur: 183.16, bpm: 105.94, t0: 0.35 };
SONG.spb = 60 / SONG.bpm;
const beatOf = t => (t - SONG.t0) / SONG.spb;
const beatTime = b => SONG.t0 + b * SONG.spb;
// pulse that peaks on each beat, decays over the beat
const beatPulse = (t, sharp = 6) => { const b = beatOf(t); return b < 0 ? 0 : Math.exp(-sharp * frac(b)); };

// Timed lyrics, from the file's own subtitle track.
const LYRICS = [

  [137.139, 139.377, 'What DARPA ought to fund next fiscal year,'],
  [139.377, 141.409, 'And stamp across a phase-three syllabus:'],
  [141.409, 145.622, 'Phytochemical metabolic adjuvant', 'R'],

  [155.219, 158.0, 'Will call it horse tonic.'],
];
const SECTIONS = [
  [0, 9.078, 'Intro'], [9.078, 26.929, 'Verse 1'], [26.929, 36.916, 'Refrain'],
  [36.916, 55.255, 'Verse 2'], [55.255, 69.525, 'Refrain'], [69.525, 80.986, 'Break'],
  [80.986, 106.188, 'Verse 3'], [106.188, 113.929, 'Refrain'], [113.929, 141.409, 'Verse 4'],
  [141.409, 149.528, 'Refrain'], [149.528, 158.1, 'Outro'], [158.1, 183.16, 'Coda'],
];
// Loudness of the master, 10 samples/s, base-36 (0..35)
const ENV_STR = '079ankk50jlll00lkkb06kkmccqoom00nnm20fmmn00pqqpdeutsf2jqqq00qppn03rrrhdprpq43ppon32poob0cpwzwuuptuqrsppifmmkmcaoki00mqpqadoonlbdpnm00dhhj0frrokhhokk52jmnn87llmc8eooo97kmlk00nmmd06loslnusrsghsrqh9iomn8aonmm00klnhefkik99nmlk00mmme9hqqqgerqqp20llmb0dlprdboqqp62mlk70hnno18qtwwqltttobdmnwrswuuuklturmkqtsr93pprp97tttjemuuuekvwxvoovvumdmrsud9ssst9awwwnfoxxxgbwzzygaxxxo7jxxznlzzzzqowxysnqrqrdetstuhjvvunfmnorgjsqqn9dqrpcdmrttnhpmmmeirqoccostuhdppplbdpoqa7lmop5aqqssnpuuuokpmprkjqpnmdfpno9apppsbaqonf9fqpnc6nptwnputrohgpqqhhqrttjgpprqmhnnoffopop9grqnh3doqrjlrtvxrmutuqd4nntrqvtuwmovusrknvtrfcnoqqa9mllggisrrglvyzxqpvvvsjgppshfpnno58mlmgfhnqtoptwxynjtuwullttvljrtuvmmvuurilsuwmjtstukktvvrnpuuukhtuvwkiuuvqjnuvwnmuvvwkhstupjnstunmtuvvonuvvroqvwwoouvvwnltvwsnouuujgstvwkiuuvrkotuvnntvvwnlttuqmpwwwonsttumkuvvphkstujboruwonuvvrnqrrqhdponnbfqpoeajkjlbdpnmk61lll88knnk7epqpoggponcbhihk64nnooc8gdf79kihi59nlkicdpnojhppprggssttklsrqkjqspq97nnnnfirpo8amoopdepnpokmnnmeeprstjhqpomdgrqpd8ppqsffppmj8coqphgqqoqcbpooj89prqf9loopaeqqronntsrjkqrush647bcbd98745544b89qstmbhrtti8prrs66txzvsqwwwlanqtxqpwwwtkmuxwpowwvtd8rstocbsuujhtvwwhivxxtmpvwxqlrtuxnjuutnbbstwpnstswnovtspknuuuknvvtumnxwvqmqyyyqoyywxnnwvvojpvuujirrrpkmvtqjhpuutkjuutqfgtuuplqsqqhfrrtunnvutmkruttkkuuusonutsnlsvvvnmutrqkntsrjhqsrsiiusspnpxwujgqtttlkutsqigssuomrvvvmktttqjiqrskinsssknuvvtprwvvootutshfqqrninvvtkirttslluutneerrrkgppqriiqrtpifoppggssssd9nnme06oon50innn00psuuhbuvvi7jpptlmxvutcessrgcossp30noon33ooohepsrrbftvvtlluutlemrrsa4qrro00pppb0fmnqikpponfcnmj60ckki00ijjkacmlkd6fllm98kkjkdgopogbfjkk66ijjmechfh54489200quwxlftvxumotuwomuvwyrpxwwrkpuvxojstuwmjtwxurtxwwnkuvwxnkuvwrmqwxyqotttvnjtuwslotuwniuuwwnmuvvqjnsvxpltsuvonuwxsruyyyomwwxxqnuvxtruxxztuyyyxspvwwrmqvxyqnvwxxrowxwsmpvxzrnsuwvnjtvwtptwwwomtvxxqmtuvqkouwwpltuvuliruvqjorsumjstvvspvwvpkrvwwmkstttolruwtog000000000000000';
const ENV = Array.from(ENV_STR, c => parseInt(c, 36) / 35);
const loud = t => { const i = t * 10, a = Math.floor(i); if (a < 0) return 0; if (a >= ENV.length - 1) return 0; const f = i - a; return ENV[a] * (1 - f) + ENV[a + 1] * f; };

/* ---------------- keyframe helper (eased segments) ---------------- */
function KF(list) {
  return t => {
    if (t <= list[0][0]) return list[0][1];
    for (let i = 1; i < list.length; i++) {
      if (t < list[i][0]) {
        const [t0, v0] = list[i - 1], [t1, v1] = list[i];
        const u = (t - t0) / (t1 - t0), e = u * u * (3 - 2 * u);
        return v0 + (v1 - v0) * e;
      }
    }
    return list[list.length - 1][1];
  };
}

/* =====================================================================
   RIG — one skeleton, two species. Body frame: x forward, y up, z toward
   the camera (the horse's right side). Metres.
   ===================================================================== */
const RIG = {
  H0: 1.20, walkDrop: 0.045,
  fore: { pivot: [0.50, 0.25], z: 0.155, hoofZ: 0.122, len: [0.48, 0.3673, 0.36, 0.24, 0.13],
          rest: [-48 * DEG, -127.03 * DEG, -90 * DEG, -90 * DEG, -59.5 * DEG],
          hoofLen: 0.0894, hoofOff: -25 * DEG, nomX: 0.6746, cf: 0.08, cfT: 0.02 },
  hind: { root: [-0.68, 0.0], z: 0.165, hoofZ: 0.132, len: [0.444, 0.474, 0.32, 0.12],
          rest: [-58.8 * DEG, -137.6 * DEG, -90 * DEG, -56 * DEG],
          hoofLen: 0.0815, hoofOff: -25 * DEG, nomX: -0.7202, cf: 0.09, cfT: 0.05 },
  neckRoot: [0.60, 0.10], neckLen: [0.30, 0.30, 0.30], neckRest: [40 * DEG, 53 * DEG, 63 * DEG],
  headLen: 0.60, headRest: -55 * DEG,
  tailRoot: [-1.00, 0.20],
};
const LEGS = [
  { id: 'LF', fore: true, side: -1, walk: 0.25, trot: 0.0 },
  { id: 'RF', fore: true, side: 1, walk: 0.75, trot: 0.5 },
  { id: 'LH', fore: false, side: -1, walk: 0.0, trot: 0.5 },
  { id: 'RH', fore: false, side: 1, walk: 0.5, trot: 0.0 },
];
const VWALK = 0.80 / 0.60 / (2 * SONG.spb);   // stance 0.80 m, duty .60, stride = 2 beats
const VTROT = 1.90 / SONG.spb;                // stride = 1 beat
const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

/* ---- DOF table: inertia, strength, passive, damping, limits, collapse pose ---- */
const DOFS = [], DI = {};
function addDof(name, o) { DI[name] = DOFS.length; DOFS.push(Object.assign({ name, I: 1, amax: 650, k: 6, c: 2.2, cc: 0.4, co: 0.12, w: 40, z: 0.85, ta: 0.008, lo: -2, hi: 2, fold: 0, kl: 0, grp: 0 }, o)); }
for (const L of LEGS) {
  const g = L.fore ? 0 : 1;

/* ---- planar IK helpers ---- */

/* ---------------------------- the horse ---------------------------- */

/* muscles: every joint is a pair of opposing actuators, integrated — never posed */
function muscles(H, dt, P) {
  const sp = SPECIES[H.kind];

    const d = DOFS[i];

    let tv = (tgt - H.tqp[i]) / dt, tacc = (tv - H.tvp[i]) / dt;
    if (!H.init) { tv = 0; tacc = 0; }
    H.tqp[i] = tgt; H.tvp[i] = tv;

    const accDes = w * w * (lead - q) + 2 * z * w * (tv - v) + clamp(tacc, -600, 600);

    const al = 1 - Math.exp(-dt / d.ta);

    H.b[i] += (clamp(co + Math.max(0, -drive), 0, 1) - H.b[i]) * al;

/* tail: verlet strand hung from the dock; mane: damped springs along the crest */
const TAIL_N = 11;

  for (let i = 0; i < TAIL_N; i++) { const p = [root[0] - 0.05 * i, root[1] - 0.09 * i, root[2]]; H.tail.p.push(p); H.tail.o.push(p.slice()); }

function stepHorse(H, t, dt, P) {

/* =====================================================================
   RENDER3D — perspective camera, faceted lofts, painter's sort.

const VW = 1600, VH = 900;
const CAM = { E: [0, 1.5, 10], f: [0, 0, -1], r: [1, 0, 0], u: [0, 1, 0], F: 1650, cx: 800, cy: 450, roll: 0, cr: 1, sr: 0, sx: 0, sy: 0 };
function setCamera(T, az, el, dist, F, roll, shakeX = 0, shakeY = 0) {
  const ca = Math.cos(el);
  CAM.E = [T[0] + dist * Math.sin(az) * ca, T[1] + dist * Math.sin(el), T[2] + dist * Math.cos(az) * ca];
  CAM.f = vnorm(vsub(T, CAM.E));

  CAM.u = vcross(CAM.r, CAM.f);

}
function proj(p) {
  const vx = p[0] - CAM.E[0], vy = p[1] - CAM.E[1], vz = p[2] - CAM.E[2];
  let z = vx * CAM.f[0] + vy * CAM.f[1] + vz * CAM.f[2];
  if (z < 0.05) z = 0.05;
  const s = CAM.F / z;
  const x = (vx * CAM.r[0] + vy * CAM.r[1] + vz * CAM.r[2]) * s;
  const y = -(vx * CAM.u[0] + vy * CAM.u[1] + vz * CAM.u[2]) * s;
  return { x: CAM.cx + CAM.sx + x * CAM.cr - y * CAM.sr, y: CAM.cy + CAM.sy + x * CAM.sr + y * CAM.cr, z, s };
}
const f1 = v => (Math.round(v * 10) / 10);

/* lighting rig, set per frame by the director */
const LIGHT = { dir: vnorm([-0.45, 0.8, 0.55]), col: [1, 1, 1], amb: [0.35, 0.38, 0.45], gnd: [0.18, 0.16, 0.14], rim: [0.6, 0.7, 0.9], rimK: 0.5, xray: 0 };

  const up = n[1] * 0.5 + 0.5;
  const vx = CAM.E[0] - c[0], vy = CAM.E[1] - c[1], vz = CAM.E[2] - c[2], vl = Math.hypot(vx, vy, vz) || 1;
  const ndv = (n[0] * vx + n[1] * vy + n[2] * vz) / vl;

  const out = [0, 0, 0];
  for (let k = 0; k < 3; k++) {
    const amb = L.amb[k] * up + L.gnd[k] * (1 - up);
    out[k] = clamp(base[k] * (amb + (dif * 0.9 + wrapd) * L.col[k]) + rim * L.rim[k] * 255 * 0.55 + emit * base[k], 0, 255);

}
const rgbs = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';

/* polygon bucket */
let POLYS = [];
function pushPoly(pts2, z, fill, extra = '') {
  let d = 'M' + f1(pts2[0].x) + ' ' + f1(pts2[0].y);
  for (let i = 1; i < pts2.length; i++) d += 'L' + f1(pts2[i].x) + ' ' + f1(pts2[i].y);
  POLYS.push({ z, h: '<path d="' + d + 'Z" fill="' + fill + '" stroke="' + fill + '" stroke-width=".7" stroke-linejoin="round"' + extra + '/>' });
}
function pushRaw(z, h) { POLYS.push({ z, h }); }

/* loft: rings of world points → shaded, culled quads.  colorFn(i, k) → [r,g,b] */
function loft(rings, colorFn, opt = {}) {

  for (let i = 0; i < nR - 1; i++) {
    const ax = vlerp(ctr[i], ctr[i + 1], 0.5);
    for (let k = 0; k < nS; k++) {
      const k2 = (k + 1) % nS;
      const p0 = rings[i][k], p1 = rings[i][k2], p2 = rings[i + 1][k2], p3 = rings[i + 1][k];
      const c = [(p0[0] + p1[0] + p2[0] + p3[0]) / 4, (p0[1] + p1[1] + p2[1] + p3[1]) / 4, (p0[2] + p1[2] + p2[2] + p3[2]) / 4];

  }

}

/* leg world points: returns {pts3: world points of chain, frames} */
function legWorld(H, li) {

  const ab = H.q[LEGBASE[li] + (L.fore ? 5 : 4)];

function drawLeg(H, li, robot, look) {
  const L = LEGS[li], W = legWorld(H, li), P = W.pts;
  const ST = robot ? (L.fore ? FORE_ST_R : HIND_ST_R) : (L.fore ? FORE_ST : HIND_ST);
  const u = mvec(H.M, [0, 0, 1]);
  const rings = [], mats = [];
  const near = L.side > 0;
  for (const s of ST) {
    const [si, fr, ru, rw, mat] = s;
    const a = P[si], b = P[Math.min(si + 1, P.length - 1)];
    const c = vlerp(a, b, fr);
    let tdir;

    rings.push(ring(c, u, w, ru * bulge, rw * bulge, robot ? 10 : 10, robot ? 3.2 : 2.2));

    if (robot) return i % 2 ? STEEL.shell : STEEL.shell2;
    if (mats[i] === 1 || mats[i + 1] === 1) return white && i >= 7 ? BAY.white : BAY.dark;

}

/* piston-muscle for the robot: barrel on the proximal bone, rod on the distal */
function piston(A, B, act, col, z) {
  const pa = proj(A), pb = proj(B);
  const mx = lerp(pa.x, pb.x, 0.58), my = lerp(pa.y, pb.y, 0.58);
  const s = (pa.s + pb.s) / 2;
  const glow = clamp(act, 0, 1);
  let h = '<line x1="' + f1(pa.x) + '" y1="' + f1(pa.y) + '" x2="' + f1(mx) + '" y2="' + f1(my) + '" stroke="#262c36" stroke-width="' + f1(0.034 * s) + '" stroke-linecap="round"/>';
  h += '<line x1="' + f1(mx) + '" y1="' + f1(my) + '" x2="' + f1(pb.x) + '" y2="' + f1(pb.y) + '" stroke="#c9d3de" stroke-width="' + f1(0.014 * s) + '" stroke-linecap="round"/>';
  h += '<line x1="' + f1(pa.x) + '" y1="' + f1(pa.y) + '" x2="' + f1(mx) + '" y2="' + f1(my) + '" stroke="' + col + '" stroke-opacity="' + (0.2 + 0.8 * glow).toFixed(2) + '" stroke-width="' + f1((0.008 + 0.012 * glow) * s) + '" stroke-linecap="round"/>';

}
/* muscle ribbon (Muscle Dance style): three points swelling with activation */
function ribbon(A, J, B, act, col, op, z) {
  const P = [proj(A), proj(J), proj(B)];
  const wv = (0.012 + 0.03 * clamp(act, 0, 1));
  const L = [], R = [];
  for (let i = 0; i < 3; i++) {
    const pr = P[Math.max(0, i - 1)], nx = P[Math.min(2, i + 1)];
    let dx = nx.x - pr.x, dy = nx.y - pr.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const w = wv * P[i].s * (i === 1 ? 1 : 0.35);

  }

  pushRaw(z, '<path d="' + d + '" fill="' + col + '" fill-opacity="' + op.toFixed(2) + '"/>');
}
// muscle pairs across leg joints; joint j sits between chain segments j-1 and j
function legMuscles(H, li, W, robot) {
  const L = LEGS[li], P = W.pts, base = LEGBASE[li], near = L.side > 0;
  const xr = LIGHT.xray;
  if (!robot && xr < 0.02) return;
  if (robot && !near && xr < 0.5) return;
  const joints = L.fore ? [[1, 1, 0.30, 0.09], [2, 2, 0.24, 0.07], [3, 3, 0.15, 0.05]] : [[1, 0, 0.30, 0.10], [2, 1, 0.26, 0.075], [3, 2, 0.15, 0.05]];
  const out = mvec(H.M, [0, 0, L.side]);
  for (const [pj, dofo, reach, r] of joints) {
    const J = P[pj], A0 = P[pj - 1], B0 = P[pj + 1];
    const dA = vnorm(vsub(A0, J)), dB = vnorm(vsub(B0, J));
    const nB = vnorm(vcross(out, dB)), nA = vnorm(vcross(dA, out));
    const qi = base + dofo, aA = H.a[qi], aB = H.b[qi];
    const lat = vmul(out, r * 0.75);
    for (const sgn of [1, -1]) {
      const act = sgn > 0 ? aA : aB;
      const A = vadd(vadd(vadd(J, vmul(dA, reach)), vmul(nA, sgn * r * 0.8)), lat);
      const B = vadd(vadd(vadd(J, vmul(dB, reach * 0.62)), vmul(nB, sgn * r * 0.7)), lat);
      const Jm = vadd(vadd(J, vmul(vnorm(vadd(nA, nB)), sgn * r * 1.15)), lat);
      const z = proj(J).z + (near ? -0.11 : 0.03);
      if (robot && xr < 0.5) piston(A, B, act, sgn > 0 ? '#ffb240' : '#6ee8f5', z);
      else ribbon(A, Jm, B, act, sgn > 0 ? '#ff5f86' : '#5fe6e0', 0.35 + 0.6 * act, z - 0.01);
    }
  }
}

/* -------------------------- the whole animal -------------------------- */
function drawHorse(H, look = {}) {
  const robot = H.kind === 'robot', u = mvec(H.M, [0, 0, 1]), xr = LIGHT.xray;
  const alpha = 1 - xr * 0.62;
  // body
  const BS = robot ? BODY_ROBOT : BODY_REAL, rings = [];
  for (const s of BS) {
    const [x, top, bot, hw] = s;
    const c = toWorld(H, [x, (top + bot) / 2, 0]);
    rings.push(ring(c, u, mvec(H.M, [0, 1, 0]), hw, (top - bot) / 2, robot ? 18 : 16, robot ? 5 : 2.35));
  }
  const glow = H.glow;
  loft(rings, (i, k, n) => {
    if (robot) {
      if (n[1] < -0.35) return STEEL.under;
      return (i % 2) ? STEEL.shell : STEEL.shell2;
    }
    return n[1] < -0.55 ? BAY.belly : BAY.coat;
  }, { alpha });
  if (robot) robotPack(H, u);
  // neck + head
  const nk = neckChain(H);
  drawNeckHead(H, nk, robot, u, alpha, look);
  // legs
  const W = [];
  for (let i = 0; i < 4; i++) W.push(drawLeg(H, i, robot, look));
  for (let i = 0; i < 4; i++) legMuscles(H, i, W[i], robot);
  // tail
  drawTail(H, robot);
  if (!robot) drawMane(H, nk);
  return W;
}

function robotPack(H, u) {
  const up = mvec(H.M, [0, 1, 0]);
  const r = [];
  for (const x of [-0.40, -0.38, 0.22, 0.24]) {
    const hh = (x < -0.39 || x > 0.23) ? 0.04 : 0.055;
    r.push(ring(toWorld(H, [x, 0.295, 0]), u, up, 0.15, hh, 12, 6));
  }
  loft(r, (i) => i === 1 ? [58, 64, 76] : [92, 100, 114], { capStart: true, capEnd: true });
  const cells = 6, lvl = H.glow;
  for (let k = 0; k < cells; k++) {
    const x0 = -0.33 + k * 0.088, on = lvl * cells > k + 0.5;
    const a = toWorld(H, [x0, 0.30, 0.153]), b = toWorld(H, [x0 + 0.062, 0.30, 0.153]);
    const pa = proj(a), pb = proj(b);
    pushRaw(pa.z - 0.03, '<line x1="' + f1(pa.x) + '" y1="' + f1(pa.y) + '" x2="' + f1(pb.x) + '" y2="' + f1(pb.y) + '" stroke="' + (on ? '#ffb240' : '#2c3340') + '" stroke-width="' + f1(0.02 * pa.s) + '" stroke-linecap="round"/>');
  }

  const sd = 0.257, near = vdot(u, vsub(CAM.E, toWorld(H, [0, 0, 0]))) > 0 ? 1 : -1;
  const seam = (x, y0, y1) => { const a = proj(toWorld(H, [x, y0, sd * near])), b = proj(toWorld(H, [x, y1, sd * near])); return 'M' + f1(a.x) + ' ' + f1(a.y) + 'L' + f1(b.x) + ' ' + f1(b.y); };
  const zf = proj(toWorld(H, [0, 0, sd * near])).z - 0.05;
  let d = seam(-0.55, 0.2, -0.24) + seam(-0.06, 0.2, -0.26) + seam(0.42, 0.22, -0.25);
  const s1 = proj(toWorld(H, [-0.85, -0.12, sd * near])), s2 = proj(toWorld(H, [0.70, -0.12, sd * near]));
  const g = H.glow;
  pushRaw(zf, '<path d="' + d + '" stroke="#5d6878" stroke-width="1.2" fill="none" stroke-opacity=".7"/>' +
    '<line x1="' + f1(s1.x) + '" y1="' + f1(s1.y) + '" x2="' + f1(s2.x) + '" y2="' + f1(s2.y) + '" stroke="#ffb240" stroke-opacity="' + (0.35 + 0.55 * g).toFixed(2) + '" stroke-width="' + f1(0.016 * s1.s) + '"/>');
  if (near > 0) {
    const o = proj(toWorld(H, [-0.40, 0.03, sd])), ex = proj(toWorld(H, [-0.30, 0.03, sd])), ey = proj(toWorld(H, [-0.40, 0.13, sd]));
    const k = 1 / 100;
    pushRaw(zf - 0.001, '<text transform="matrix(' + [(ex.x - o.x) * k, (ex.y - o.y) * k, -(ey.x - o.x) * k, -(ey.y - o.y) * k, o.x, o.y].map(f1).join(' ') + ')" font-family="B612,system-ui,sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" fill="#3b4452">XQ-69  LS3</text>');
  }
}

function drawNeckHead(H, nk, robot, u0, alpha, look) {
  const P = nk.pts, yaw = nk.yaw;
  const lat = mvec(H.M, [Math.sin(yaw), 0, Math.cos(yaw)]);
  // neck rings
  const rings = [];
  const N = robot ? 8 : 9;
  for (let j = 0; j <= N; j++) {
    const t = j / N, seg = clamp(t * 3, 0, 2.9999), k = Math.floor(seg), f = seg - k;
    const c0 = vlerp(P[k], P[k + 1], f), ang = nk.ang[k];
    const up = [-Math.sin(ang) * Math.cos(yaw), Math.cos(ang), Math.sin(ang) * Math.sin(yaw)];
    const r = neckRadius(t);
    const c = vadd(c0, vmul(up, r.off));
    const rr = robot ? { h: lerp(0.15, 0.10, t), w: lerp(0.12, 0.085, t) } : r;
    rings.push(ring(toWorld(H, c), lat, mvec(H.M, up), rr.w, rr.h, robot ? 10 : 14, robot ? 3 : 2.2));
  }
  loft(rings, (i) => robot ? (i % 2 ? [120, 130, 146] : STEEL.shell2) : BAY.coat, { alpha, bias: 0.01 });
  // head
  const poll = P[3], ha = nk.ang[3];
  const dir = [Math.cos(ha) * Math.cos(yaw), Math.sin(ha), -Math.cos(ha) * Math.sin(yaw)];
  const front = [-Math.sin(ha) * Math.cos(yaw), Math.cos(ha), Math.sin(ha) * Math.sin(yaw)];
  const HS = robot ? HEAD_ROBOT : HEAD_REAL, hr = [], NS = robot ? 12 : 14;
  for (const s of HS) {
    const c = vadd(vadd(poll, vmul(dir, s[0] * RIG.headLen)), vmul(front, s[3]));
    hr.push(ring(toWorld(H, c), lat, mvec(H.M, front), s[2], s[1], NS, robot ? 4.5 : 2.3, Math.PI / 2));
  }
  const W = (b) => (k) => b;
  loft(hr, (i, k, n, c) => {
    if (robot) {
      // visor band on the front faces near the eyes
      if (i === 2 && Math.abs(k - NS / 2) > 2 && Math.abs(k - NS / 2) < NS / 2 - 1) return STEEL.visor;
      return i % 2 ? STEEL.shell : STEEL.shell2;
    }
    const fwd = k === 0 || k === 1 || k === NS - 1;            // faces on the nasal ridge
    if (fwd && i >= 1 && i <= 6 && look.blaze) return BAY.white;
    if (i >= 6) return BAY.muzzle;
    return BAY.coat;
  }, { alpha, capEnd: true, capColor: robot ? STEEL.joint : BAY.muzzle });
  // eyes, nostrils / camera eyes
  const fe = robot ? 0.52 : 0.28;
  for (const sd of [1, -1]) {
    const hs = HS.find(s => s[0] >= fe) || HS[2];
    const c = vadd(vadd(vadd(poll, vmul(dir, fe * RIG.headLen)), vmul(front, robot ? 0.03 : 0.035 + hs[3])), [0, 0, 0]);
    const latv = [Math.sin(yaw) * sd, 0, Math.cos(yaw) * sd];
    const pw = toWorld(H, vadd(c, vmul(latv, hs[2] * 0.97)));
    const nrm = mvec(H.M, latv);
    if (vdot(nrm, vsub(CAM.E, pw)) <= 0) continue;
    const pp = proj(pw);
    if (robot) {
      const g = H.glow;
      pushRaw(pp.z - 0.06, '<circle cx="' + f1(pp.x) + '" cy="' + f1(pp.y) + '" r="' + f1(0.03 * pp.s) + '" fill="#0d1118"/>' +
        '<circle cx="' + f1(pp.x) + '" cy="' + f1(pp.y) + '" r="' + f1(0.018 * pp.s) + '" fill="#6ee8f5" fill-opacity="' + (0.15 + 0.85 * g).toFixed(2) + '"/>' +
        (g > 0.3 ? '<circle cx="' + f1(pp.x) + '" cy="' + f1(pp.y) + '" r="' + f1(0.05 * pp.s) + '" fill="#6ee8f5" fill-opacity="' + (0.18 * g).toFixed(2) + '"/>' : ''));
    } else {
      pushRaw(pp.z - 0.06, '<ellipse cx="' + f1(pp.x) + '" cy="' + f1(pp.y) + '" rx="' + f1(0.024 * pp.s) + '" ry="' + f1(0.017 * pp.s) + '" fill="#160f0c"/>' +
        '<circle cx="' + f1(pp.x - 0.006 * pp.s) + '" cy="' + f1(pp.y - 0.006 * pp.s) + '" r="' + f1(0.005 * pp.s) + '" fill="#fff" fill-opacity=".7"/>');
      // nostril
      const nc = vadd(vadd(poll, vmul(dir, 0.92 * RIG.headLen)), vmul(front, 0.0));
      const nw = toWorld(H, vadd(nc, vmul(latv, 0.062)));
      const np = proj(nw);
      pushRaw(np.z - 0.05, '<ellipse cx="' + f1(np.x) + '" cy="' + f1(np.y) + '" rx="' + f1(0.016 * np.s) + '" ry="' + f1(0.011 * np.s) + '" fill="#1d1210" fill-opacity=".85"/>');
    }
  }
  // ears / antenna stubs
  for (const sd of [-1, 1]) {
    const eq = H.q[sd < 0 ? DI.eL : DI.eR];
    const ea = ha + 112 * DEG + eq;          // ear axis in sagittal plane (positive = forward)
    const ed = [Math.cos(ea) * Math.cos(yaw), Math.sin(ea), -Math.cos(ea) * Math.sin(yaw)];
    const latv = [Math.sin(yaw) * sd, 0, Math.cos(yaw) * sd];
    const base = vadd(vadd(vadd(poll, vmul(dir, 0.05)), vmul(front, 0.07)), vmul(latv, 0.05));
    const len = robot ? 0.11 : 0.15;
    const tip = vadd(vadd(base, vmul(ed, len)), vmul(latv, 0.02));
    const b1 = vadd(base, vmul(dir, 0.035)), b2 = vadd(base, vmul(dir, -0.035));
    const m1 = vadd(vlerp(b1, tip, 0.5), vmul(dir, 0.018)), m2 = vadd(vlerp(b2, tip, 0.5), vmul(dir, -0.018));
    const pts = [b1, m1, tip, m2, b2].map(p => proj(toWorld(H, p)));
    const z = pts[2].z + (sd > 0 ? -0.02 : 0.03);
    if (robot) {
      pushPoly(pts, z, rgbs(shadeRGB(STEEL.joint, mvec(H.M, latv), toWorld(H, base))));
      const tp = pts[2];
      pushRaw(z - 0.01, '<circle cx="' + f1(tp.x) + '" cy="' + f1(tp.y) + '" r="' + f1(0.012 * tp.s) + '" fill="#ffb240" fill-opacity="' + (0.25 + 0.75 * H.glow).toFixed(2) + '"/>');
    } else {
      pushPoly(pts, z, rgbs(shadeRGB(BAY.coat, mvec(H.M, latv), toWorld(H, base))), alpha < 1 ? ' fill-opacity="' + alpha + '"' : '');
      const inner = [b1, m1, tip, m2, b2].map(p => proj(toWorld(H, vadd(vlerp(p, vlerp(b1, b2, 0.5), 0.35), vmul(latv, 0.004)))));
      pushPoly(inner, z - 0.002, '#3a2418');
    }
  }
  if (robot) {
    // LiDAR puck on the crown, spinning
    const c = vadd(vadd(poll, vmul(dir, 0.22)), vmul(front, 0.125));
    const cw = toWorld(H, c), upw = mvec(H.M, front);
    const r1 = ring(cw, lat, vnorm(vcross(upw, lat)), 0.075, 0.075, 16, 2);
    const r2 = ring(vadd(cw, vmul(upw, 0.07)), lat, vnorm(vcross(upw, lat)), 0.075, 0.075, 16, 2);
    loft([r1, r2], (i, k) => (k + Math.floor((H.lidar || 0) * 16)) % 8 === 0 ? [255, 120, 90, 1.2 * H.glow] : [34, 38, 46], { capEnd: true, capColor: [120, 130, 146] });
    H.lidarPos = vadd(cw, vmul(upw, 0.03));
  } else {
    // forelock
    const fl0 = toWorld(H, vadd(vadd(poll, vmul(dir, 0.04)), vmul(front, 0.10)));
    const fl1 = toWorld(H, vadd(vadd(poll, vmul(dir, 0.20)), vmul(front, 0.12)));
    strand([fl0, vlerp(fl0, fl1, 0.5), fl1], [0.05, 0.04, 0.008], BAY.mane, proj(fl0).z - 0.08);
  }
  H.nosePos = toWorld(H, vadd(poll, vmul(dir, RIG.headLen)));
  H.headDir = mvec(H.M, dir);
}

/* camera-facing tapered strip through world points */
function strand(pts, widths, col, z, op = 1) {
  const P = pts.map(proj), L = [], R = [];
  for (let i = 0; i < P.length; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    let dx = b.x - a.x, dy = b.y - a.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const w = widths[i] * P[i].s * 0.5;
    L.push({ x: P[i].x - dy * w, y: P[i].y + dx * w }); R.unshift({ x: P[i].x + dy * w, y: P[i].y - dx * w });
  }
  const n = [0.2, 0.9, 0.3];
  const c = rgbs(shadeRGB(col, vnorm(n), pts[0]));
  pushPoly(L.concat(R), z, c, op < 1 ? ' fill-opacity="' + op + '"' : '');
}
function drawTail(H, robot) {
  const T = H.tail; if (!T) return;
  const P = T.p;
  if (robot) {
    const pp = P.map(proj);
    let d = 'M' + f1(pp[0].x) + ' ' + f1(pp[0].y);
    for (let i = 1; i < 6; i++) d += 'L' + f1(pp[i].x) + ' ' + f1(pp[i].y);
    const tip = pp[5];
    pushRaw(pp[0].z + 0.02, '<path d="' + d + '" fill="none" stroke="#8d99a8" stroke-width="' + f1(0.014 * pp[0].s) + '" stroke-linecap="round"/>' +
      '<circle cx="' + f1(tip.x) + '" cy="' + f1(tip.y) + '" r="' + f1(0.016 * tip.s) + '" fill="#ff5a4a" fill-opacity="' + (0.25 + 0.75 * H.glow * (0.6 + 0.4 * Math.sin(H.blink || 0))).toFixed(2) + '"/>');
    return;
  }
  // dock (fleshy) + three hair locks
  const z = proj(P[3]).z + 0.06;
  strand(P.slice(0, 4), [0.085, 0.075, 0.065, 0.06], BAY.coat, z - 0.005);
  const side = mvec(H.M, [0, 0, 1]);
  for (let s = -1; s <= 1; s++) {
    const pts = P.slice(1).map((p, i) => vadd(p, vmul(side, s * 0.018 * i / 10)));
    const w = pts.map((p, i) => { const u = i / (pts.length - 1); return (0.05 + 0.11 * Math.sin(Math.PI * Math.pow(u, 0.7))) * (s === 0 ? 1 : 0.7); });
    strand(pts, w, s === 0 ? [34, 28, 26] : BAY.mane, z + s * 0.004);
  }
}
function drawMane(H, nk) {
  const M = H.mane; if (!M || !M[0].p) return;
  for (let i = 0; i < M.length - 1; i++) {
    const a = M[i], b = M[i + 1];
    const pts = [proj(a.root), proj(b.root), proj(b.p), proj(vlerp(a.p, b.p, 0.5)), proj(a.p)];
    pts[3] = { x: pts[3].x + (hash(i) - 0.5) * 3, y: pts[3].y + 2 + hash(i + 7) * 4, z: pts[3].z, s: pts[3].s };

/* ground shadow of an animal: a strip under the body plus thick strokes for limbs */
function horseShadow(H, W, op) {
  const L = LIGHT.dir;
  if (L[1] < 0.08) return '';
  const sh = p => [p[0] - L[0] * p[1] / L[1], 0.002, p[2] - L[2] * p[1] / L[1]];
  const BS = H.kind === 'robot' ? BODY_ROBOT : BODY_REAL;
  const left = [], right = [];
  for (const s of BS) {
    let mn = null, mx = null;
    for (const [yy, zz] of [[s[1], 0], [s[2], 0], [(s[1] + s[2]) / 2, s[3]], [(s[1] + s[2]) / 2, -s[3]], [s[1] * 0.7, s[3] * 0.7], [s[1] * 0.7, -s[3] * 0.7]]) {
      const g = sh(toWorld(H, [s[0], yy, zz]));
      if (!mn || g[2] < mn[2]) mn = g; if (!mx || g[2] > mx[2]) mx = g;
    }
    left.push(proj(mn)); right.unshift(proj(mx));
  }
  const pts = left.concat(right);
  let h = '<path d="M' + pts.map(p => f1(p.x) + ' ' + f1(p.y)).join('L') + 'Z"/>';
  const nk = neckChain(H);
  const neck = nk.pts.map(p => proj(sh(toWorld(H, p))));
  h += '<path d="M' + neck.map(p => f1(p.x) + ' ' + f1(p.y)).join('L') + '" fill="none" stroke-width="' + f1(0.2 * neck[1].s) + '" stroke-linecap="round" stroke-linejoin="round"/>';
  for (const w of W) {
    const pp = w.pts.slice(1).map(p => proj(sh(p)));
    h += '<path d="M' + pp.map(p => f1(p.x) + ' ' + f1(p.y)).join('L') + '" fill="none" stroke-width="' + f1(0.075 * pp[0].s) + '" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  if (H.tail) { const tp = H.tail.p.map(p => proj(sh(p))); h += '<path d="M' + tp.map(p => f1(p.x) + ' ' + f1(p.y)).join('L') + '" fill="none" stroke-width="' + f1(0.07 * tp[2].s) + '" stroke-linecap="round"/>'; }
  return '<g fill="#000" stroke="#000" opacity="' + op.toFixed(2) + '">' + h + '</g>';
}

const PDT = 1 / 120, PN = Math.ceil((SONG.dur + 6) / PDT);

/* robot boot probes (Muscle Dance calibration homage) */
const PROBE = new Float64Array(NDOF);
function probeAt(t) {
  PROBE.fill(0);
  if (t < 2 || t > 8.4) return PROBE;
  for (let i = 0; i < NDOF; i++) {
    const t0 = 2.1 + (i % 15) * 0.36 + (i >= 15 ? 0.18 : 0);
    const u = (t - t0) / 0.55;
    if (u > 0 && u < 1) PROBE[i] = 0.16 * Math.sin(u * TAU * 1.5) * Math.sin(u * Math.PI);
  }
  return PROBE;
}

function robotIntent(t) {
  const P = { x: robotX(t), z: 0, gaitW: 0, neck: [0, 0, 0, 0, 0], ears: [0.1, 0.1], tail: 0.2 };
  if (t < 9) { P.probe = probeAt(t); P.tone = 0.55 + 0.45 * sstep(2, 8.5, t); P.neck = [-0.05 + 0.1 * sstep(4.4, 6, t), 0, 0, 0.25 * Math.sin(Math.max(0, t - 5) * 1.3) * (1 - sstep(7.8, 9, t)), 0]; }
  // plug pulled: a one-beat flinch
  const fl = sstep(23.5, 23.62, t) * (1 - sstep(23.62, 24.2, t));
  P.neck[0] += 0.18 * fl; P.neck[4] -= 0.2 * fl;
  // grid drops: stagger, a dragging hind leg, head searching
  const g = sstep(51.4, 51.9, t);
  if (g > 0) {
    P.lift = [1, 1 - 0.3 * g, 1, 1 - 0.8 * g];
    P.neck[0] += g * 0.18 * noise1(t * 7); P.neck[3] += g * 0.35 * noise1(t * 5 + 9); P.neck[4] += g * 0.25 * noise1(t * 6 + 3);
  }
  const twitch = 0.45 * sstep(54.95, 55.05, t) * (1 - sstep(55.05, 55.4, t));
  P.pow = [1 - sstep(53.72, 53.86, t), 1 - sstep(53.58, 53.72, t), clamp(1 - sstep(53.95, 54.2, t) + twitch, 0, 1)];
  return P;
}
function robotGlow(t) {
  let g = sstep(3.0, 5.2, t);
  const fl = (t > 23.5 && t < 24.0) ? (hash(Math.floor(t * 30)) > 0.5 ? 0.2 : 1) : 1;
  g *= fl;
  if (t > 51.32) g *= (hash(Math.floor(t * 24)) > 0.35 + 0.6 * sstep(51.32, 53.6, t) ? 1 : 0.15) * (1 - 0.6 * sstep(51.32, 53.6, t));
  if (t > 53.8) g *= 1 - sstep(53.8, 54.4, t);
  return clamp(g, 0, 1);
}

function horseIntent(t) {
  const P = { x: horseX(t), z: HZ, gaitW: t > 158.0 ? 1 : 0, neck: [0, 0, 0, 0, 0], ears: [0, 0], tail: 0.05 };
  const N = P.neck;
  // sniffing the fallen machine
  const S = sstep(75.5, 76.9, t) * (1 - sstep(78.25, 79.0, t));
  N[0] -= 0.40 * S; N[1] -= 0.26 * S; N[2] -= 0.10 * S; N[3] += 0.55 * S; N[4] -= 0.04 * S;
  const snort = sstep(77.95, 78.05, t) * (1 - sstep(78.05, 78.45, t));
  N[0] += 0.16 * snort; N[4] += 0.22 * snort;
  // a mouthful of what grows
  const bite = sstep(103.0, 103.7, t) * (1 - sstep(104.2, 104.9, t));
  N[0] -= 0.36 * bite; N[1] -= 0.22 * bite; N[3] -= 0.18 * bite;
  // the supersonic jet overhead
  const boom = sstep(151.55, 151.7, t) * (1 - sstep(151.7, 152.6, t));
  N[0] += 0.2 * boom; N[4] += 0.12 * boom;
  // standing at the barn, a look around
  const st = sstep(154.6, 155.4, t) * (1 - sstep(157.6, 158.1, t));
  N[3] -= 0.35 * st; N[0] += 0.08 * st;
  // ears: alert while approaching, back at the boom, little flicks otherwise
  const alert = sstep(72.8, 74.0, t) * (1 - sstep(79, 81, t)) + 0.6 * st;
  const fl = n => 0.5 * Math.max(0, noise1(t * 0.9 + n) - 0.55) * 4;
  P.ears = [0.35 * alert - 0.15 + 0.25 * Math.sin(t * 0.7) * 0.4 - fl(3) - 0.9 * boom, 0.35 * alert - 0.12 + 0.25 * Math.sin(t * 0.6 + 2) * 0.4 - fl(11) - 0.9 * boom];
  P.tail = 0.05 + 0.22 * noise1(t * 0.8 + 5) + 0.3 * sstep(158, 159.5, t);
  return P;
}

function prop(o) { const p = Object.assign({ y: 0, z: -12, unit: 0.01, t0: -99, t1: 999, fin: 0.6, fout: 0.9, draw: 0, lw: 1.5, layer: 'mid', act: 0, w: 900 }, o); PROPS.push(p); return p; }
// path helpers (local units, y up is negative)
const PL = 'pathLength="1"';
const pth = (d, a = '') => `<path d="${d}" ${PL} ${a}/>`;
const circD = (x, y, r) => `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
const rectD = (x, y, w, h) => `M${x} ${y}h${w}v${h}h${-w}Z`;
const lab = (x, y, s, size = 20, a = '') => `<text x="${x}" y="${y}" font-size="${size}" ${a}>${s}</text>`;
function dim(x1, y1, x2, y2, label, off = 0) {
  const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a) * 9, ny = Math.cos(a) * 9;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  return pth(`M${x1} ${y1}L${x2} ${y2}M${x1 + nx} ${y1 + ny}L${x1 - nx} ${y1 - ny}M${x2 + nx} ${y2 + ny}L${x2 - nx} ${y2 - ny}`, 'class="thin"') +
    `<text x="${mx}" y="${my - 8 + off}" font-size="15" text-anchor="middle" class="dimt">${label}</text>`;
}
function gearD(cx, cy, r, n, tooth = 9) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a0 = i / n * TAU, a1 = (i + 0.25) / n * TAU, a2 = (i + 0.5) / n * TAU, a3 = (i + 0.75) / n * TAU;
    const P = (a, rr) => (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1);
    d += (i ? 'L' : 'M') + P(a0, r) + 'L' + P(a1, r + tooth) + 'L' + P(a2, r + tooth) + 'L' + P(a3, r);
  }
  return d + 'Z' + circD(cx, cy, r * 0.32);
}
const rnd = (() => { let s = 7; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();

// far skyline: a research campus, radar domes, pylons with live cables
(function skyline() {
  let d = '', win = Array.from({ length: 14 }, () => ''), cables = '', lights = '';
  const x0 = -170, x1 = ROB_STOP + 175;
  let x = x0;
  while (x < x1) {
    const w = 6 + rnd() * 12, h = 4 + rnd() * 12, kind = rnd();
    d += `M${x.toFixed(1)} 0V${(-h).toFixed(1)}H${(x + w).toFixed(1)}V0`;
    if (kind < 0.18) { const r = Math.min(w * 0.4, 5); d += `M${(x + w / 2 - r).toFixed(1)} ${-h.toFixed(1)}a${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${(2 * r).toFixed(1)} 0`; }
    else if (kind < 0.34) { const mh = 6 + rnd() * 10; d += `M${(x + w * 0.7).toFixed(1)} ${-h}V${(-h - mh).toFixed(1)}`; lights += `<circle cx="${(x + w * 0.7).toFixed(1)}" cy="${(-h - mh).toFixed(1)}" r=".55" class="avl"/>`; }
    else if (kind < 0.46) { d += `M${(x + w * 0.3).toFixed(1)} ${-h}l2.2 -3.2M${(x + w * 0.3 - 2.2).toFixed(1)} ${(-h - 2).toFixed(1)}a3.2 1.4 -35 1 0 6 -2.5`; }
    const bin = clamp(Math.floor((x - x0) / (x1 - x0) * 14), 0, 13);
    for (let fy = -h + 1.6; fy < -1.2; fy += 2.1) for (let fx = x + 1.1; fx < x + w - 1; fx += 1.9) if (rnd() > 0.38) win[bin] += `M${fx.toFixed(1)} ${fy.toFixed(1)}h.9v.7h-.9z`;
    x += w + 1 + rnd() * 7;
  }
  // pylons
  for (let px = x0 + 6; px < x1; px += 30) {
    d += `M${px - 2.6} 0L${px - 0.5} -19L${px + 0.5} -19L${px + 2.6} 0M${px - 2.0} -6L${px + 1.6} -12M${px + 2.0} -6L${px - 1.6} -12M${px - 4} -17H${px + 4}M${px - 3} -14H${px + 3}`;
    if (px + 30 < x1) for (const [yy, dx] of [[-17, -4], [-17, 4], [-14, -3]]) cables += `M${px + dx} ${yy}Q${px + 15 + dx} ${yy + 3.2} ${px + 30 + dx} ${yy}`;
  }
  const svg = `<path d="M${x0} 0H${x1}" class="thin"/><path d="${d}" fill="none"/>` +
    win.map((w, i) => `<path d="${w}" class="wins" data-bin="${i}"/>`).join('') +
    `<path d="${cables}" class="cable" fill="none"/>` + lights;
  prop({ id: 'skyline', x: 0, z: -260, unit: 1, layer: 'far', svg, lw: 1, cls: 'bp', act: 1,
    anim(el, t) {
      const n = nightB(t), wave = clamp((t - 51.32) / 0.9, 0, 1);
      if (!el._w) el._w = el.querySelectorAll('.wins'), el._c = el.querySelector('.cable'), el._l = el.querySelectorAll('.avl');
      el._w.forEach((w, i) => { const off = t > 51.32 && (13 - i) / 13 < wave * 1.15; w.setAttribute('opacity', off ? 0 : 0.75 * (0.85 + 0.15 * Math.sin(i * 3 + t * 0.7))); });
      el._c.setAttribute('stroke-opacity', t < 51.32 ? 0.55 + 0.3 * beatPulse(t, 4) : 0.08);
      const blink = (Math.sin(t * 4) > 0.6 && t < 51.32) ? 1 : 0.1;
      el._l.forEach(l => l.setAttribute('opacity', blink));
      el.setAttribute('opacity', 0.62 * (1 - actB(t)) * (1 - 0.6 * n));
    } });
})();

// ARPANET 1969: four nodes, packets reroute around a blast on the UCLA–SRI line
(function arpanet() {
  const N = { UCLA: [-250, 70], UCSB: [-300, -110], SRI: [-30, -150], UTAH: [260, -40] };
  const link = (a, b, c = '') => pth(`M${N[a][0]} ${N[a][1]}L${N[b][0]} ${N[b][1]}`, c);
  let s = lab(-330, -250, 'ARPANET, 1969', 26, 'class="hd"') + pth('M-330 -238H-40', 'class="thin"');
  s += link('UCLA', 'SRI', 'class="cut"') + link('UCLA', 'UCSB') + link('UCSB', 'SRI') + link('SRI', 'UTAH');
  for (const [k, [x, y]] of Object.entries(N)) s += pth(circD(x, y, 30)) + pth(rectD(x - 15, y - 10, 30, 20), 'class="thin"') + lab(x + (x > 0 ? 40 : -40), y + 6, k, 20, `text-anchor="${x > 0 ? 'start' : 'end'}"`);
  s += `<g class="blast" opacity="0"><path d="M-140 -40l14 -36 4 30 30 -22 -18 32 36 4 -36 12 22 28 -32 -14 -6 34 -10 -32 -30 18 18 -30 -34 -6 34 -10z" class="hot"/></g>`;
  s += `<g class="pk"></g>` + lab(110, 90, 'IMP host interface', 15, 'class="dimt"') + dim(-250, 140, 260, 140, '1 HOP = 1 IMP', 0);
  const route1 = [N.UCLA, N.SRI, N.UTAH], route2 = [N.UCLA, N.UCSB, N.SRI, N.UTAH];
  const along = (r, u) => { const L = []; let tot = 0; for (let i = 1; i < r.length; i++) { const l = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]); L.push(l); tot += l; } let d = u * tot; for (let i = 0; i < L.length; i++) { if (d <= L[i]) { const f = d / L[i]; return [lerp(r[i][0], r[i + 1][0], f), lerp(r[i][1], r[i + 1][1], f)]; } d -= L[i]; } return r[r.length - 1]; };
  prop({ id: 'arpanet', x: camXAt(11.4) + 3.6, y: 2.85, z: -14, sc: 1.12, t0: 9.1, t1: 13.7, draw: 1, svg: s, cls: 'bp',
    anim(el, t) {
      const cut = t > 11.62;
      el.querySelector('.blast').setAttribute('opacity', cut ? Math.max(0, 1 - (t - 11.62) * 0.7) : 0);
      el.querySelector('.cut').setAttribute('stroke-dasharray', cut ? '.03 .05' : '1');
      let pk = '';
      for (let i = 0; i < 6; i++) {
        const u = frac((t - 9.5) * 0.55 + i / 6), r = cut ? route2 : route1, [x, y] = along(r, u);
        pk += `<rect x="${(x - 6).toFixed(1)}" y="${(y - 6).toFixed(1)}" width="12" height="12" class="pkt"/>`;
      }
      el.querySelector('.pk').innerHTML = pk;
    } });
})();

/* ---------- captions ---------- */
let capOn = true;
function lineAt(t) { for (let i = 0; i < LYRICS.length; i++) { const L = LYRICS[i]; if (t >= L[0] - 0.05 && t < L[1] + 0.35) { const next = LYRICS[i + 1]; if (next && t >= next[0] - 0.05) continue; return L; } } return null; }
function updateCaptions(t) {
  const L = capOn ? lineAt(t) : null;
  if (!L) { LY.cap.innerHTML = ''; return; }
  const [s, e, text, kind] = L;
  const machine = s < 70;
  const out = 1 - sstep(e, e + 0.35, t);
  // refrains: 1 lives on the robot as callouts, 3 on the roadside sign
  if (kind === 'R' && (s < 40 || (s > 100 && s < 115))) { LY.cap.innerHTML = ''; return; }
  if (kind === 'R') {
    const night = s < 70;
    const a = sstep(s, s + 0.6, t) * out;
    LY.cap.innerHTML = night
      ? `<text x="800" y="190" text-anchor="middle" font-size="30" letter-spacing="6" fill="#cfe0f5" opacity="${(a * 0.8).toFixed(3)}" font-family="B612,system-ui,sans-serif">${text}</text>`
      : `<text x="800" y="200" text-anchor="middle" font-size="56" font-style="italic" fill="#fff4dc" opacity="${a.toFixed(3)}" class="lp" font-family="'IM Fell English',Georgia,serif">${text}</text>`;
    return;
  }
  if (machine) {
    const n = Math.floor(text.length * clamp((t - s) / Math.min(0.9, (e - s) * 0.55), 0, 1));
    const cur = n < text.length || Math.sin(t * 9) > 0 ? '<tspan fill="#7fe6ff">▍</tspan>' : '';
    LY.cap.innerHTML = `<text x="96" y="812" font-size="30" fill="#eef6ff" opacity="${out.toFixed(3)}" class="mc" font-family="B612,system-ui,sans-serif" letter-spacing=".5">${esc(text.slice(0, n))}${cur}</text>`;
    if (s > 24 && s < 26) redact(t, text);
  } else {
    const words = text.split(' '), span = (e - s) * 0.5;
    let h = `<text x="96" y="816" font-size="40" fill="#fff8ea" class="lp" font-family="'IM Fell English',Georgia,serif">`;
    words.forEach((w, i) => { const a = sstep(s + i / words.length * span, s + i / words.length * span + 0.28, t) * out; h += `<tspan opacity="${a.toFixed(3)}">${esc(w)} </tspan>`; });
    LY.cap.innerHTML = h + '</text>';
  }
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function redact(t, text) {
  if (t < 25.84) return;
  const tx = LY.cap.querySelector('text'); if (!tx) return;
  const k = sstep(25.84, 26.1, t);
  let h = '';
  for (const w of ['Pentagon', 'reclassify']) {
    const i = text.indexOf(w); if (i < 0) continue;
    try {
      const n = tx.getNumberOfChars(); if (i + w.length > n) continue;
      const x0 = tx.getStartPositionOfChar(i).x, wd = tx.getSubStringLength(i, w.length) * k;
      h += `<rect x="${f1(x0 - 3)}" y="788" width="${f1(wd + 6)}" height="34" fill="#000"/>`;
    } catch (e) {}
  }
  LY.cap.insertAdjacentHTML('beforeend', h);
}

/* =====================================================================
   MAIN — fixed-step physics (120 Hz) locked to the song clock.
   Checkpoints every 2 s make scrubbing exact: the same muscles, the same fall.
   ===================================================================== */
const DT = 1 / 120;
const CKPT = new Map();
function newState() { const R = makeHorse('robot', robotX(0), 0); R.lidar = 0; R.blink = 0; R.glow = 0; return { k: 0, R, H: null }; }
let S = newState();
function simStep(St, live) {
  const t = St.k / 120;
  const R = St.R;
  if (t < 96) { R.glow = robotGlow(t); R.lidar += DT * (0.25 + 2.4 * R.glow); R.blink += DT * (t > 55 ? 2.4 : 7); stepHorse(R, t, DT, robotIntent(t)); }
  if (t >= 69.3) { if (!St.H) St.H = makeHorse('real', horseX(t), HZ); stepHorse(St.H, t, DT, horseIntent(t)); }
  if (live) spawnFromEvents(St.H ? [R, St.H] : [R], t);
  R.events.length = 0; if (St.H) St.H.events.length = 0;
  St.k++;
  if (St.k % 240 === 0 && !CKPT.has(St.k)) CKPT.set(St.k, structuredClone({ k: St.k, R: St.R, H: St.H }));
}
function simSeek(T) {
  const target = Math.max(0, Math.floor(T * 120));
  if (target < S.k || target - S.k > 240) {
    let best = -1;
    for (const k of CKPT.keys()) if (k <= target && k > best) best = k;
    if (best > S.k || target < S.k) { if (best >= 0) S = structuredClone(CKPT.get(best)); else S = newState(); }
    PARTS.length = 0;
  }
  while (S.k < target) simStep(S, false);
}
function simAdvance(T, live) {
  const target = Math.floor(T * 120);
  if (target < S.k || target - S.k > 60) { simSeek(T); return; }
  while (S.k < target) simStep(S, live);
}
// fill checkpoints in idle time so any scrub is instant
(function precompute() {
  const P = newState();
  const chunk = () => { const end = P.k + 600; while (P.k < end && P.k < SONG.dur * 120) simStep(P, false); if (P.k < SONG.dur * 120) setTimeout(chunk, 12); };
  setTimeout(chunk, 400);
})();
Object.defineProperty(window, 'SIM', { get: () => S });

/* ------------------------------ render ------------------------------ */
let xrayOn = false, xrayK = 0;
const svgRoot = document.getElementById('film');
function render(t, dt) {
  const [sx, sz] = camSubject(t);
  let shx = 0, shy = 0;
  if (!REDUCED) {
    const imp = S.R ? clamp(S.R.impact * 2.2, 0, 7) * (t > 53 && t < 56 ? 1 : 0) : 0;
    const boom = t > 151.55 && t < 152.4 ? 9 * (1 - (t - 151.55) / 0.85) : 0;
    const st = t > beatTime(247) && t < beatTime(247) + 0.3 ? 6 * (1 - (t - beatTime(247)) / 0.3) : 0;
    const pl = t > 23.57 && t < 23.85 ? 4 : 0;
    const k = imp + boom + st + pl;
    if (k > 0.05) { shx = (hash(t * 91) - 0.5) * k * 2; shy = (hash(t * 53 + 1) - 0.5) * k * 2; }
  }
  setCamera([sx, CAMK.ty(t), sz], CAMK.az(t) * DEG, CAMK.el(t) * DEG, CAMK.dist(t), 1650, CAMK.roll(t), shx, shy);
  LIGHT.dir = vnorm([LK.dx(t), LK.dy(t), LK.dz(t)]);
  LIGHT.col = LK.col(t).map(v => v / 255); LIGHT.amb = LK.amb(t).map(v => v / 255); LIGHT.gnd = LIGHT.amb.map(v => v * 0.6);
  LIGHT.rim = LK.rim(t).map(v => v / 255); LIGHT.rimK = LK.rimK(t);
  xrayK += ((xrayOn ? 1 : 0) - xrayK) * Math.min(1, dt * 8 + (dt === 0 ? 1 : 0));
  LIGHT.xray = xrayK;
  if (actB(t) > 0.001) tintFarm(t, svgRoot);
  const hz = horizonY();
  updateSky(t, hz); updateProps(t); updateGround(t, hz);
  JPOLYS = []; drawF117(t); JPOLYS.sort((a, b) => b.z - a.z);
  LY.jets.innerHTML = JPOLYS.map(p => p.h).join('') + drawX59(t);
  POLYS = [];
  let sh = '';
  const shOp = clamp(0.34 * (1 - nightB(t) * 0.75) * (t < 70 ? 1 : clamp(LIGHT.dir[1] * 1.4, 0.12, 1)), 0.05, 0.4);
  if (S.R && t < 92) { const W = drawHorse(S.R, {}); sh += horseShadow(S.R, W, shOp); }
  if (S.H && t >= 69.3) { breathe(S.H, t); const W = drawHorse(S.H, { blaze: true, sock: 3 }); sh += horseShadow(S.H, W, shOp); }
  POLYS.sort((a, b) => b.z - a.z);
  LY.actors.innerHTML = POLYS.map(p => p.h).join('');
  LY.shadow.innerHTML = sh;
  updateFX(t, dt); updateHUD(t); updateCaptions(t); grade(t);
  // the room takes on the colour of the sky
  const amb = mixc(PAL.mid(t), PAL.hor(t), 0.4).map(v => v * 0.28);
  document.body.style.backgroundColor = css(amb);
}
function grade(t) {
  const black = Math.max(1 - sstep(0.15, 1.5, t), sstep(181.6, 183.1, t) * 0.9);
  $('gBlack').setAttribute('opacity', black.toFixed(3));
  const red = t > 51.3 && t < 55.6 ? 0.28 * beatPulse(t, 5) * (1 - sstep(54.6, 55.6, t)) : 0;
  $('gRed').setAttribute('opacity', red.toFixed(3));
  const white = !REDUCED && t > 151.55 && t < 152.1 ? 0.32 * (1 - (t - 151.55) / 0.55) : 0;
  $('gWhite').setAttribute('opacity', white.toFixed(3));
  $('gVig').setAttribute('opacity', (0.45 + 0.35 * nightB(t)).toFixed(3));
}

/* ------------------------------ player ------------------------------ */
const audio = $('track');
let playing = false, filmT = 0, lastNow = 0, silent = false, dirty = true, ended = false, posterUp = true;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function note(msg) { const n = $('note'); n.textContent = msg; n.hidden = !msg; }
function goSilent() { if (silent) return; silent = true; note('The soundtrack couldn’t play, so the film is running silently. Check that Tonic.m4a is at dormantone.github.io/presentations/. Safari may also need the AAC copy, Tonic_aac.m4a, uploaded beside it.'); }
audio.addEventListener('error', goSilent);
{ const srcs = audio.querySelectorAll('source'); if (srcs.length) srcs[srcs.length - 1].addEventListener('error', goSilent); }
async function play() {
  if (ended || filmT >= SONG.dur - 0.05) { filmT = 0; ended = false; $('endCard').hidden = true; }
  posterUp = false; $('poster').hidden = true;
  if (!silent) {
    try { audio.currentTime = filmT; await audio.play(); }
    catch (e) { if (e && e.name !== 'AbortError') goSilent(); }
  }
  setPlaying(true);
}
function pause() { audio.pause(); setPlaying(false); }
function setPlaying(p) {
  playing = p; dirty = true;
  const b = $('playBtn');
  b.setAttribute('aria-label', p ? 'Pause' : 'Play');
  b.innerHTML = p ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
}
function seek(t) {
  filmT = clamp(t, 0, SONG.dur); dirty = true;
  if (ended && filmT < SONG.dur - 0.05) { ended = false; $('endCard').hidden = true; }
  if (!silent) { try { audio.currentTime = filmT; } catch (e) {} }
  if (posterUp) { posterUp = false; $('poster').hidden = true; }
}
function showEnd() { ended = true; $('endCard').hidden = false; $('replayBtn').focus(); }

function tick(now) {
  const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0; lastNow = now;
  if (playing) {
    const buffering = !silent && !audio.paused && audio.readyState < 3;
    if (!buffering) filmT += dt;
    if (!silent && !audio.paused && audio.readyState >= 2) {
      const d = audio.currentTime - filmT;
      if (Math.abs(d) > 0.25) filmT = audio.currentTime; else filmT += d * 0.1;
    }
    if (filmT >= SONG.dur) { filmT = SONG.dur; pause(); showEnd(); }
  }
  if (playing || dirty) {
    simAdvance(filmT, playing);
    render(filmT, playing ? dt : 0);
    updateTransport();
    dirty = playing;
  }
  requestAnimationFrame(tick);
}

/* transport: sections are the real song structure */
const scrub = $('scrub');
SECTIONS.forEach(([a, b, name]) => {
  const s = document.createElement('span'); s.className = 'seg'; s.style.left = (a / SONG.dur * 100) + '%'; s.style.width = ((b - a) / SONG.dur * 100) + '%';
  s.title = name; scrub.appendChild(s);
});
const fill = document.createElement('span'); fill.className = 'fill'; scrub.appendChild(fill);
const knob = document.createElement('span'); knob.className = 'knob'; scrub.appendChild(knob);
function updateTransport() {
  const p = filmT / SONG.dur * 100;
  fill.style.width = p + '%'; knob.style.left = p + '%';
  $('time').textContent = fmt(filmT) + ' / ' + fmt(SONG.dur);
  const sec = SECTIONS.find(([a, b]) => filmT >= a && filmT < b) || SECTIONS[SECTIONS.length - 1];
  $('section').textContent = sec[2];
  scrub.setAttribute('aria-valuenow', Math.round(filmT));
  scrub.setAttribute('aria-valuetext', fmt(filmT) + ', ' + sec[2]);
}
let dragging = false;
const scrubTo = e => { const r = scrub.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width, 0, 1) * SONG.dur); };
scrub.addEventListener('pointerdown', e => { dragging = true; scrub.setPointerCapture(e.pointerId); scrubTo(e); });
scrub.addEventListener('pointermove', e => { if (dragging) scrubTo(e); });
scrub.addEventListener('pointerup', () => dragging = false);
scrub.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); seek(filmT + (e.key === 'ArrowRight' ? 5 : -5)); }
  if (e.key === 'Home') { e.preventDefault(); seek(0); } if (e.key === 'End') { e.preventDefault(); seek(SONG.dur - 0.1); }
});
$('playBtn').addEventListener('click', () => playing ? pause() : play());
$('bigPlay').addEventListener('click', play);
$('replayBtn').addEventListener('click', () => { seek(0); play(); });
const toggle = (id, fn) => { const b = $(id); b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); dirty = true; }); };
toggle('xrayBtn', on => xrayOn = on);
toggle('capBtn', on => capOn = on);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === ' ' || e.key === 'k') { if (e.target.tagName === 'BUTTON' && e.key === ' ') return; e.preventDefault(); playing ? pause() : play(); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target !== scrub) { e.preventDefault(); seek(filmT + (e.key === 'ArrowRight' ? 5 : -5)); }
  if (e.key === 'm') $('xrayBtn').click();
  if (e.key === 'c') $('capBtn').click();
});
// poster frame: the robot calibrated, title block on the drawing
initProps();
setPlaying(false);
filmT = 7.4; simSeek(7.4); render(7.4, 0); updateTransport(); filmT = 0; dirty = false;
$('time').textContent = '0:00 / ' + fmt(SONG.dur);
requestAnimationFrame(tick);
// test hook
window.__frame = t => { filmT = t; simSeek(t); render(t, 1 / 60); updateTransport(); return S.k; };

</script>
</body>
</html>
