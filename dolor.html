<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolor in Vacuo</title>
<meta name="description" content="A film for the song Dolor in Vacuo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --vacuum:#000;
  --bone:#d9cdb2;
  --bone-dim:rgba(217,205,178,.66);
  --tungsten:#f2b35e;
  --formalin:#b9c47c;
  --indicator:#ff3527;
  --serif:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --caps:"IM Fell English SC","IM Fell English","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--vacuum:#000;--bone:#d9cdb2;--bone-dim:rgba(217,205,178,.66)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--vacuum);color:var(--bone);overflow:hidden}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:var(--vacuum);-webkit-user-select:none;user-select:none;overflow:hidden}
#stage.idle{cursor:none}
#film{position:absolute;inset:0;width:100%;height:100%;display:block}
.svg-caps{font-family:var(--caps)}
.svg-it{font-family:var(--serif);font-style:italic}
#grain{position:absolute;inset:-60px;pointer-events:none;opacity:.075;mix-blend-mode:screen;background-size:256px 256px}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
#scrim{position:absolute;left:0;right:0;bottom:0;height:32vh;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.7) 68%,rgba(0,0,0,.84))}
#lyric{position:absolute;left:0;right:0;bottom:calc(8vh + env(safe-area-inset-bottom,0px));height:0;pointer-events:none}
#lyric .line{position:absolute;left:50%;bottom:0;width:min(34em,90vw);transform:translateX(-50%);text-align:center;font-size:clamp(19px,2.4vw,38px);line-height:1.36;opacity:0;display:none;text-wrap:balance}
#lyric .line.latin{font-family:var(--caps);font-size:clamp(20px,2.6vw,42px);letter-spacing:.05em;width:min(28em,92vw)}
#lyric .w{position:relative;display:inline-block;white-space:nowrap}
#lyric .w.unit{font-style:italic}
#lyric .ch{display:inline-block;white-space:pre}
#lyric .split .base{visibility:hidden}
#lyric .split .half{position:absolute;left:0;top:0}
#lyric .split .top{clip-path:inset(0 0 50% 0)}
#lyric .split .bot{clip-path:inset(50% 0 0 0)}
body.portrait #lyric .line{bottom:auto;top:0}
body.portrait #scrim,body.portrait #vignette{display:none}
#note{position:absolute;left:clamp(18px,4vw,64px);top:clamp(16px,4.5vh,56px);width:min(22.5em,calc(100vw - 36px));font-size:clamp(13px,1.08vw,16.5px);line-height:1.5;color:var(--bone-dim);opacity:0;pointer-events:none}
#note .ttl{font-style:italic;color:var(--tungsten);font-size:1.1em;margin-bottom:.3em}
#note p{margin:0}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:0 clamp(12px,3vw,40px) calc(10px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .5s;z-index:4}
#bar.show{opacity:1;pointer-events:auto}
#bar button{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--bone);font:inherit;font-size:15px;padding:8px 7px;cursor:pointer;border-radius:3px;line-height:1;display:inline-flex;align-items:center}
#bar button[aria-pressed="false"]{opacity:.45}
#seek{flex:1;-webkit-appearance:none;appearance:none;height:24px;background:transparent;cursor:pointer;margin:0}
#seek::-webkit-slider-runnable-track{height:1px;background:rgba(217,205,178,.38)}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:var(--tungsten);margin-top:-4px}
#seek::-moz-range-track{height:1px;background:rgba(217,205,178,.38)}
#seek::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--tungsten)}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--bone-dim);white-space:nowrap}
#bar button:focus-visible,#seek:focus-visible,#play:focus-visible,#err label:focus-within{outline:1px solid var(--tungsten);outline-offset:3px}
#intro{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--vacuum);transition:opacity 1.2s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{font-family:var(--caps);font-weight:400;font-size:clamp(40px,7vw,96px);letter-spacing:.04em;line-height:1;margin:0;color:var(--bone)}
#intro .sub{font-style:italic;font-size:clamp(16px,1.7vw,22px);color:var(--bone-dim);margin:.7em 0 2.1em}
#play{appearance:none;-webkit-appearance:none;width:96px;height:96px;border-radius:50%;border:1px solid rgba(242,179,94,.55);background:none;color:var(--tungsten);font-family:var(--serif);font-size:19px;cursor:pointer;transition:box-shadow .4s,background-color .4s}
#play:hover{box-shadow:0 0 38px rgba(242,179,94,.28);background-color:rgba(242,179,94,.06)}
#play:disabled{opacity:.6;cursor:progress}
#intro .hint{margin:2em 0 0;font-size:14px;color:rgba(217,205,178,.5)}
#intro .hint+.hint{margin-top:.4em}
.portrait-only{display:none}
body.portrait .portrait-only{display:block}
#err{max-width:30em;margin-top:1.8em;font-size:15px;line-height:1.55;color:var(--bone)}
#err p{margin:0 0 1em}
#err label{display:inline-block;position:relative;border:1px solid rgba(217,205,178,.45);padding:.5em 1.1em;border-radius:3px;cursor:pointer}
#err input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:pre-line}
@media (prefers-reduced-motion:reduce){#intro,#bar{transition:none}}
</style>
</head>

const NOTES=[
{a:6.6,b:13.6,t:'Kymograph, 1847',p:'A drum turned by clockwork while a stylus scratches the body’s pulse into soot. Carl Ludwig built the first one in 1847. The one at the top right is recording the song.'},
{a:16.3,b:22.3,t:'Formalin',p:'Formaldehyde dissolved in water. It binds the proteins of a body to one another, so the tissue stops changing.'},
{a:22.6,b:29.8,t:'Cyclopia',p:'The most severe form of holoprosencephaly: the forebrain fails to divide in two, and a single eye forms. One-eyed lambs born in Idaho in the 1950s led to cyclopamine, a lily alkaloid that blocks the Sonic hedgehog signal.'},
{a:65.8,b:74.9,t:'Phrenology, Vienna, c. 1800',p:'Franz Joseph Gall divided the mind into 27 faculties and read them from the bumps of the skull. The bumps were wrong. The hunch that functions have places in the brain was not.'},
{a:76.0,b:83.2,t:'Phineas Gage, 13 September 1848',p:'A tamping iron 3 ft 7 in long and 13¼ lb went up through his left cheek and out the top of his head. He spoke within minutes and lived almost twelve more years. Friends said he was “no longer Gage.”'},
{a:86.6,b:92.1,t:'Memristor',p:'A resistor that remembers how much charge has passed through it. Leon Chua predicted it in 1971 as the missing fourth circuit element; HP Labs built one in 2008. Arrays of them are studied as artificial synapses.'},
{a:92.4,b:100.2,t:'The optic nerve',p:'About a million axons per eye, carrying the retina’s output to the brain. Retinal and cortical implants already turn light into electrical pulses for some blind patients: coarse, but real.'},
{a:115.0,b:125.8,t:'The dol, 1940s',p:'At Cornell, Hardy, Wolff and Goodell focused a lamp’s heat on skin blackened with ink and counted 21 just-noticeable steps from first pain to the most they could register: a scale of 10½ dols. Past that, the pain stopped growing. The unit never caught on.'},
{a:133.6,b:141.0,t:'Without a ceiling',p:'Nerves saturate. Software need not: it can be run faster, longer, and in many copies at once. If anything in it can suffer, nothing obvious caps how much.'},
{a:178.8,b:185.6,t:'Nociception',p:'Nociception is the signal of damage; pain is the experience. Each can happen without the other: under anesthesia, signals fire unfelt; in a phantom limb, pain arrives from a hand that is not there.'},
{a:186.0,b:193.8,t:'IASP, 2020',p:'The International Association for the Study of Pain defines pain as an experience, and adds that being unable to describe it does not mean it is absent, in humans or in other animals.'},
{a:197.6,b:205.4,t:'Kant, c. 1780',p:'Kant argued that cruelty to animals is wrong partly because of what it does to the one who inflicts it: it hardens them toward people too.'},
{a:216.6,b:226.2,t:'Metzinger, 2021',p:'The philosopher Thomas Metzinger has called for a global moratorium on research that risks creating artificial suffering, warning of a possible “explosion of negative phenomenology.”'},
{a:228.8,b:238.6,t:'In vacuo, 1768',p:'In Joseph Wright of Derby’s <i>An Experiment on a Bird in the Air Pump</i>, a lecturer draws the air from a glass vessel. The bird is dying. The painting is about the faces watching it.'}
];

const fmt=x=>{x=Math.max(0,x);return Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');};
function setPlayIcon(){const p=audio.paused;bPlay.setAttribute('aria-label',p?'Play':'Pause');bPlay.innerHTML=p?ICON_PLAY:ICON_PAUSE;}
function poke(){bar.classList.add('show');stage.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(!audio.paused){bar.classList.remove('show');stage.classList.add('idle');}},2600);}
function showErr(){errBox.hidden=false;}
function hideErr(){errBox.hidden=true;}
async function begin(){
  hideErr();playBtn.disabled=true;playBtn.textContent='Loading';
  try{
    if(audio.ended||audio.currentTime>=DUR-.3)audio.currentTime=0;
    await audio.play();
    if(!started&&!isNaN(startAt)){audio.currentTime=clamp(startAt,0,DUR-1);}
    started=true;playing=true;intro.classList.add('gone');poke();
  }catch(e){if(!(e&&e.name==='NotAllowedError'))showErr();}
  finally{playBtn.disabled=false;playBtn.textContent=started?'Play again':'Play';}
}
function toggle(){if(!started){begin();return;}if(audio.paused){playing=true;audio.play().catch(()=>{});}else audio.pause();poke();}
function seekTo(x){x=clamp(x,0,DUR-.05);if(stillT!==null){stillT=x;}else audio.currentTime=x;}
function toggleNotes(){notesOn=!notesOn;bNotes.setAttribute('aria-pressed',String(notesOn));}
function fullscreen(){if(!document.fullscreenEnabled)return;if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen().catch(()=>{});}
if(!document.fullscreenEnabled)bFull.hidden=true;
playBtn.addEventListener('click',begin);
bPlay.addEventListener('click',toggle);bNotes.addEventListener('click',toggleNotes);bFull.addEventListener('click',fullscreen);
seek.addEventListener('input',()=>{seeking=true;seekTo(+seek.value);});
seek.addEventListener('change',()=>{seeking=false;});
fileIn.addEventListener('change',()=>{const f=fileIn.files&&fileIn.files[0];if(!f)return;audio.src=URL.createObjectURL(f);audio.load();begin();});
audio.addEventListener('play',()=>{playing=true;setPlayIcon();});
audio.addEventListener('pause',()=>{setPlayIcon();poke();});
audio.addEventListener('waiting',()=>{stalled=true;});
audio.addEventListener('playing',()=>{stalled=false;anchorA=audio.currentTime;anchorP=performance.now();});
audio.addEventListener('seeked',()=>{anchorA=audio.currentTime;anchorP=performance.now();});
audio.addEventListener('ended',()=>{playing=false;setPlayIcon();setTimeout(()=>{playBtn.textContent='Play again';intro.classList.remove('gone');playBtn.focus();},1600);});
audio.addEventListener('error',()=>{if(stillT===null&&(!started||audio.paused))showErr();});
stage.addEventListener('pointerup',e=>{if(e.target.closest('#bar,#intro'))return;if(e.pointerType==='mouse')toggle();else poke();});
['mousemove','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(started)poke();},{passive:true}));
addEventListener('keydown',e=>{
  const tg=e.target,inField=tg&&tg.closest&&tg.closest('input,button');
  if((e.key===' '||e.key==='Enter')&&inField)return;
  if(e.key===' '||e.key==='k'){e.preventDefault();toggle();}
  else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!(tg&&tg.id==='seek')){e.preventDefault();seekTo((stillT!==null?stillT:audio.currentTime)+(e.key==='ArrowRight'?5:-5));}
  else if(e.key==='f')fullscreen();else if(e.key==='n')toggleNotes();
  if(started)poke();
});
function fit(){
  const W=innerWidth,H=innerHeight,portrait=W/H<1.2;
  svg.setAttribute('preserveAspectRatio',portrait?'xMidYMid meet':'xMidYMid slice');document.body.classList.toggle('portrait',portrait);
  if(portrait){const fh=W*900/1600,top=(H-fh)/2,bot=top+fh;lyricBox.style.top=(bot+18)+'px';lyricBox.style.bottom='auto';noteEl.style.top='auto';noteEl.style.bottom=(H-top+12)+'px';}
  else{lyricBox.style.top='';lyricBox.style.bottom='';noteEl.style.top='';noteEl.style.bottom='';}
}
addEventListener('resize',fit);fit();
{const sr=document.createElement('div');sr.className='sr-only';sr.textContent=LYRICS.map(L=>L.w.map(w=>w[0]).join(' ')).join('\n');document.body.appendChild(sr);}
setPlayIcon();
function loop(){
  const t=stillT!==null?stillT:clock();
  if(t!==lastT||!audio.paused){render(t);lastT=t;}
  if(!seeking)seek.value=t.toFixed(2);
  const sec=Math.floor(t);if(sec!==lastSec){lastSec=sec;timeEl.textContent=fmt(t)+' / '+fmt(DUR);}
  requestAnimationFrame(loop);
}
render(0);requestAnimationFrame(loop);
</script>
</body>
</html>
